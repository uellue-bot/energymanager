# Reads the forecast archive's hourly series for the comparison of production
# against both forecasts (example E5, design D8). The series lives in the
# attribute `hours`; the sensor itself is not recorded (see recorder.yaml).
rest:
  - resource: http://127.0.0.1:8765/e5?days=7
    scan_interval: 900
    sensor:
      - name: Forecast archive E5
        unique_id: energymanager_forecast_archive_e5
        value_template: "{{ value_json.hours | length }}"
        json_attributes:
          - hours

  # A first try (examples E20 to E22): weekly net electricity cost, the
  # baseline's expected cost under each week's weather and the weekly solar
  # spill, in the attribute `weeks`; the fitted baseline model in `model`. Not
  # recorded either (see recorder.yaml).
  - resource: http://127.0.0.1:8765/control-strategies
    scan_interval: 3600
    sensor:
      - name: Forecast archive control strategies
        unique_id: energymanager_forecast_archive_control_strategies
        value_template: "{{ value_json.weeks | length }}"
        json_attributes:
          - weeks
          - prices
          - model

  # The solar headroom for the next 48 h (requirements S5, spec solar-headroom):
  # state = the headroom of the next hour in kWh; the 192 quarter-hour steps in
  # the attribute `steps`; when an input is missing, its reason in `missing` and
  # no steps. Not recorded (see recorder.yaml): the archive keeps its own record.
  - resource: http://127.0.0.1:8765/headroom
    scan_interval: 900
    sensor:
      - name: Forecast archive solar headroom
        unique_id: energymanager_forecast_archive_solar_headroom
        unit_of_measurement: kWh
        value_template: "{{ value_json.steps[0].headroom_kwh if value_json.steps else none }}"
        json_attributes:
          - steps
          - missing
          - made_at
          - soc_recorded_at
          - correction_factor
          - load_fit
